
spring:
  application:
    name: sistema-pantallas

  datasource:
    url: jdbc:mysql://localhost:3306/sistema_pantallas_db
    username: root
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
